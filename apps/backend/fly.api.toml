# fly.api.toml app configuration file
#
# See https://fly.io/docs/reference/configuration/ for information

app = "omni-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512

[env]
  APP_ENV = "production"
  PORT = "8080"
